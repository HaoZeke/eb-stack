[workspace]
members = ["cargo:."]

# Config for 'dist' (cargo-dist)
[dist]
cargo-dist-version = "0.30.3"
ci = "github"
# release.yml is generated by dist; dependabot bumps the action versions in it,
# so `dist host` is told not to regenerate or check the CI file.
allow-dirty = ["ci"]
installers = ["shell", "powershell"]
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
]
# Publish the binary as eb-stack; crate package is eb_stack.
pr-run-mode = "plan"

# dist asks for macos-14 for Apple silicon; GitHub cancels a job on that
# label the second it is created, so the target builds on macos-15.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"

