# Git hooks via prek (https://prek.j178.dev). Install: prek install
#:schema https://www.schemastore.org/prek.json

exclude = """(?x)(
    ^\\.pixi/|
    ^\\.venv-docs/|
    ^docs/build/|
    ^docs/source/crates/|
    ^target/|
    ^work/|
    ^Cargo\\.lock$|
    ^pixi\\.lock$|
    ^.*\\.svg$|
    ^.*\\.png$|
    ^.*\\.jpg$|
    ^.*\\.patch$|
    ^skills/new-package/overlays/|
    ^fixtures/foreign_ingest/
)"""

[[repos]]
repo = "builtin"
hooks = [
  # Two trailing spaces in Markdown are a hard line break.
  # fixtures/lint_w291/bad.eb keeps its trailing spaces: that is the W291 case.
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"], exclude = "fixtures/lint_w291/bad\\.eb" },
  # Recorded OSV responses are the bytes the API returned.
  { id = "end-of-file-fixer", exclude = "tests/component_reach_eessi/osv/.*\\.json" },
  # meta.yaml is a conda-forge Jinja recipe, not YAML.
  { id = "check-yaml", exclude = "tests/sbom_recorded/foreign/conda/meta\\.yaml" },
  { id = "check-toml" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files", args = ["--maxkb=1500"] },
  { id = "detect-private-key" },
]

[[repos]]
repo = "https://github.com/codespell-project/codespell"
rev = "v2.4.1"
hooks = [
  {
    id = "codespell",
    args = [
      # tests/sbom_recorded is upstream EasyBuild and conda-forge text.
      "--skip=*.lock,*.svg,*.png,*.jpg,*.eb,*.patch,Cargo.lock,pixi.lock,*sbom_recorded/*",
      "-L",
      # ser: toml::ser. alo: difflib alo/ahi bounds. polute: quoted framework comment.
      "unparseable,unparsable,intack,notin,thirdparty,anlysis,libray,atleast,atmost,ser,alo,polute",
    ],
  },
]
