# 12 compilers ran out of 29.3 GiB on A64FX, so a compiler needs more than
# 2.44 GiB; 8 fitted in 27.9 GiB on zen2, so it needs less than 3.49 GiB.
[[entry.observation]]
easyconfig = "libxc-7.0.0-GCC-14.3.0.eb"
target = "aarch64/a64fx"
parallel = 12
memory_gib = 29.3
outcome = "oom"
source = "https://github.com/EESSI/software-layer-scripts/pull/233"

