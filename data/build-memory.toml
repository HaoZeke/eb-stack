# Peak build memory per EasyBuild name and version family.
#
# The estimate for one build is
#
#     base_gib + per_process_gib * parallel
#
# where `parallel` is what EasyBuild runs with on the bot after the EESSI
# hooks have cut it (see data/eessi-bot-resources.toml). An estimate that
# reaches the job's memory is a likely out-of-memory failure.
#
# `versions` are version families: `7.0` covers 7.0, 7.0.0 and 7.0.1, not
# 7.01. `toolchains` are toolchain families written as in the module name,
# `GCC-15.2` covers GCC-15.2.0. `targets` are CPU targets or a prefix of
# one, `x86_64` covers every x86_64 target. An empty list covers all. When
# more than one entry matches a build, the largest estimate is used.
#
# `bound = "lower"` means the figure is the smallest one the out-of-memory
# failures allow; the real peak may be higher.
#
# Each `observation` is a bot job from a software-layer or
# software-layer-scripts thread: the easyconfig, the target, the parallel
# level the job ran with, the memory the job had, and whether it ran out.
# The whole table must reproduce every observation; a test checks that.
# Memory is GiB. "30 GB" in a source is 27.9 GiB, "32 GB" is 29.8 GiB.

[[entry]]
name = "libxc"
versions = ["7.0"]
toolchains = ["GCC-15.2"]
targets = ["x86_64/amd/zen4"]
per_process_gib = 4.0
bound = "lower"
reason = "cc1 on the generated mgga_x_*.c sources; with GCC 15.2.0 eight compilers exceed 32 GiB on zen4"
remedy = "the maintainers asked for a libxc divider of 2.5 or 3 in eb_hooks.py, which is 6 or 5 cores on the AWS build cluster"
sources = [
  "https://github.com/EESSI/software-layer/pull/1772#issuecomment-6420263033",
  "https://github.com/EESSI/software-layer/pull/1772#issuecomment-6440377764",
]

# 4.0 GiB is 32 GiB over the 8 compilers the hook leaves of 16 cores.
# aarch64/generic built the same easyconfig at 8 on 29.8 GiB in the same
# pull request, so the entry is scoped to zen4.
[[entry.observation]]
easyconfig = "libxc-7.0.0-GCC-15.2.0.eb"
target = "x86_64/amd/zen4"
parallel = 8
memory_gib = 32.0
outcome = "oom"
source = "https://github.com/EESSI/software-layer/pull/1772#issuecomment-6420263033"

[[entry.observation]]
easyconfig = "libxc-7.0.0-GCC-15.2.0.eb"
target = "x86_64/amd/zen4"
parallel = 8
memory_gib = 32.0
outcome = "oom"
source = "https://github.com/EESSI/software-layer/pull/1772#issuecomment-6440377764"

[[entry]]
name = "libxc"
versions = ["7.0"]
per_process_gib = 3.0
reason = "cc1 on the generated mgga_x_*.c sources"
remedy = "software-layer-scripts #233 caps libxc at 6 cores on A64FX"
sources = [
  "https://github.com/EESSI/software-layer-scripts/pull/233",
  "https://github.com/EESSI/software-layer/pull/1502",
