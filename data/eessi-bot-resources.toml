# The bot asks for a whole 48-core node. Slurm accepts no more than
# --mem=30000M, about 29 GiB of the 32 GB HBM.
[[partition]]
instance = "eessi-bot-deucalion"
node = "a64fx"
target = "aarch64/a64fx"
cores = 48
memory_gib = 29.3
sources = [
  "https://github.com/EESSI/test-suite/blob/a7cd83cd67232098fbeb35d8654083d5ca76fea1/config/macc_deucalion.py#L39-L44",
  "https://github.com/EESSI/software-layer-scripts/issues/70",
  "https://github.com/EESSI/software-layer-scripts/pull/106#issuecomment-3389977541",
]

# sacct for a LAMMPS job: 16 CPUs, mem=180G, one H100.
[[partition]]
instance = "eessi-bot-surf"
node = "amd-zen4"
target = "x86_64/amd/zen4"
accel = "nvidia/cc90"
cores = 16
memory_gib = 180.0
sources = ["https://github.com/EESSI/software-layer/pull/1461#issuecomment-4337055573"]

# PARALLELISM_LIMITS from eb_hooks.py. The hook takes the cores the job
# has and applies the software's limit for the target, else its '*'
# limit. Software with limits for other targets only is left alone. Without
# a software entry the target's own limit applies. The result only ever
# lowers EasyBuild's parallel level.
[hooks]
source = "https://github.com/EESSI/software-layer-scripts/blob/608fb40c88152a9b9aaefa6634c5e39526236212/eb_hooks.py#L2705-L2768"

[[hooks.limit]]
target = "aarch64/a64fx"
divide = 4

[[hooks.limit]]
software = "hipBLASLt"
target = "*"
maximum = 8

[[hooks.limit]]
software = "libxc"
target = "*"
divide = 2

[[hooks.limit]]
software = "libxc"
target = "aarch64/a64fx"
maximum = 6

[[hooks.limit]]
software = "LLVM"
target = "*"
divide = 2

[[hooks.limit]]
software = "MBX"
target = "*"
divide = 2

[[hooks.limit]]
software = "MBX"
target = "aarch64/a64fx"
maximum = 1

[[hooks.limit]]
software = "PETSc"
target = "*"
divide = 2

[[hooks.limit]]
software = "QuantumESPRESSO"
target = "aarch64/a64fx"
maximum = 6

[[hooks.limit]]
software = "rocBLAS"
target = "*"
maximum = 8

[[hooks.limit]]
software = "TensorFlow"
target = "*"
divide = 2

[[hooks.limit]]
software = "TensorFlow"
target = "aarch64/a64fx"
maximum = 8

[[hooks.limit]]
software = "Qt5"
target = "aarch64/a64fx"
maximum = 8

[[hooks.limit]]
software = "Qt6"
target = "aarch64/a64fx"
maximum = 8

[[hooks.limit]]
software = "Qt6"
target = "*"
divide = 2

[[hooks.limit]]
software = "ROCm-LLVM"
target = "*"
maximum = 12

[[hooks.limit]]
software = "jax"
target = "*"
divide = 2
