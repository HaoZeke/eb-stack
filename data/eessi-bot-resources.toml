# What an EESSI bot build job gets, per bot instance and CPU target.
#
# `node` is what the bot prints as "Building on", `target` is "Building
# for". `cores` is the CPUs the job holds and `memory_gib` the memory a
# build in it can use. Memory is GiB; "30 GB" in a source is 27.9 GiB.
#
# The Magic Castle AWS figures are the partition descriptions in the EESSI
# test suite's ReFrame config for that cluster. The bot jobs on it hold
# all 16 cores of a node (sacct in software-layer #1772).

[easybuild]
# EasyBuild 5 runs at most 16 jobs unless max-parallel says otherwise.
max_parallel = 16
source = "https://github.com/easybuilders/easybuild-framework/pull/4816"

[[partition]]
instance = "eessi-bot-mc-aws"
node = "generic"
target = "x86_64/generic"
cores = 16
memory_gib = 27.9
sources = ["https://github.com/EESSI/test-suite/blob/4eaf857a92df441e9c68aef9e2e4c8942facb8b5/config/aws_mc.py#L34-L36"]

