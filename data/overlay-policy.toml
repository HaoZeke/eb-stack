# Overlay policy for the language-ecosystem adapters.
#
# Package identity and "do not pip-install this" are packaging decisions, not
# parser rules, so they live here as data rather than as match arms in the
# parsers. The driver contract forbids package-name branches in production
# code, and a table is also the thing a site can extend without a rebuild.

# Foreign name -> the identity it shares with an EasyBuild module. Comparison
# is done on the identity, so both sides of a pair collapse to one name.
[aliases]
torch = "pytorch"
# A build backend and the module that provides it: EasyBuild carries `poetry`,
# and a project states `poetry-core`, which is the same thing to a recipe.
poetrycore = "poetry"
flitcore = "flit"
hatchvcs = "hatchling"

# Packages an overlay must never pip-install on top of an EasyBuild stack.
# These are toolchain-built extensions: a wheel would shadow the module and
# lose the compiler, BLAS and MPI the stack was built with.
[refuse_overlay]
names = ["numpy", "scipy", "pytorch"]

# PyO3 crates whose published crate name differs from the module they import
# as. Only pairs that actually differ belong here.
[python_modules.crate]
readcon-core = "readcon"

# Build requirements a Python project states that must not become EasyBuild
# build dependencies of an overlay: the language itself, and packages the stack
# already provides as toolchain-built extensions.
[build_requires]
ignore = ["python", "numpy"]

# Crates whose presence in a Cargo manifest means the crate builds a Python
# extension module rather than a plain Rust binary or library.
[python_modules]
marker_crates = ["pyo3", "pyo3-ffi", "maturin", "numpy"]

# Packages the EasyBuild `Python` module installs as its own extensions. A
# project that requires one of these already has it from its Python
# dependency, and emitting a separate dependency sends the solver looking for
# any module that ships the name.
[python_provides]
names = ["setuptools", "pip", "wheel"]
