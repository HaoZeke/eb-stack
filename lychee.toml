# Link check for docs HTML and README.
# Offline-friendly defaults: skip local anchors and private hosts.

max_concurrency = 8
timeout = 20
accept = [200, 206, 429, 500, 502, 503, 504]
# GitHub occasionally answers 5xx on a pull-request URL during a full-site crawl.
max_retries = 5
retry_wait_time = 2

# Package, site, and repository URLs may 404 until each public surface is published.
# github.com/example is used only for structured artifact examples.
exclude = [
  '^https://crates\.io/',
  '^https://docs\.rs/',
  '^https://eb-stack\.rgoswami\.me/',
  '^https://github\.com/HaoZeke/eb-stack',
  '^https://github\.com/example/',
  # Easyconfig and API templates, not documents. A placeholder in angle
  # brackets is dropped when the URL is read back out of HTML, and the
  # remainder is not a page.
  '^https://github\.com/quarto-dev/quarto-cli/releases/download/v%\(version\)s/',
  '^https://api\.osv\.dev/v1/vulns/',
  '^https://api\.github\.com/',
]

exclude_path = [
  'docs/build/_sources/',
]

# Local file links from Sphinx are fine.
include_verbatim = true
