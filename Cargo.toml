[package]
name = "eb_stack"
version = "0.7.1"
edition = "2021"
# Floor is 1.90: `ordered-float` 5.5.1 sets rust-version 1.90.
# `uuid` 1.29.0 sets 1.89.0. Edition 2024 dependencies need Cargo 1.85.
rust-version = "1.90"
description = "Turn conda-forge, Spack, and EasyBuild recipes into Resolvo-solved variants, CycloneDX SBOMs, and build-evaluated package bundles"
license = "MIT"
authors = ["Rohit Goswami <rgoswami@ieee.org>"]
repository = "https://github.com/HaoZeke/eb-stack"
homepage = "https://eb-stack.rgoswami.me"
documentation = "https://eb-stack.rgoswami.me"
readme = "README.md"
keywords = ["easybuild", "resolvo", "sbom", "hpc", "mcp"]
categories = [
    "command-line-utilities",
    "development-tools",
    "science",
    "parser-implementations",
    "config",
]
# The crate carries the sources and the TOML tables they include; the test
# corpus, fixtures, manual, skills and delivery bundles stay in the
# repository.
exclude = [
    ".github/",
    ".pixi/",
    "assets/",
    "deliveries/",
    "docs/",
    "docs/build*/",
    "examples/",
    # Three fixture directories compile into the crate through include_str!
    # (toolchain_hierarchy, checksum_structure, review_fix); the rest stay out.
    "fixtures/cyclonedx/",
    "fixtures/eon_core_rgpot/",
    "fixtures/eon_foss_2026_1/",
    "fixtures/eon_packaging/",
    "fixtures/extension_provides/",
    "fixtures/foreign_ingest/",
    "fixtures/gromacs_2025_to_next/",
    "fixtures/hierarchy_resolve/",
    "fixtures/lint_checksum_count/",
    "fixtures/lint_concat_shlib/",
    "fixtures/lint_dep_duplicate/",
    "fixtures/lint_f541/",
    "fixtures/lint_fstring_quote_reuse/",
    "fixtures/lint_fstring_template/",
    "fixtures/lint_local_var_naming/",
    "fixtures/lint_missing_fprefix/",
    "fixtures/lint_negative/",
    "fixtures/lint_percent_local/",
    "fixtures/lint_percent_shlib/",
    "fixtures/lint_pycodestyle/",
    "fixtures/lint_python_s/",
    "fixtures/lint_redefined_param/",
    "fixtures/lint_sanity_paths_shape/",
    "fixtures/lint_shlib_hardcoded/",
    "fixtures/lint_template_removed/",
    "fixtures/lint_template_unknown/",
    "fixtures/lint_w291/",
    "fixtures/lint_w605/",
    "fixtures/maintainer_fat_26480/",
    "fixtures/maintainer_reject_26435/",
    "fixtures/maintainer_rpath_26480/",
    "fixtures/maintainer_shell_stage/",
    "fixtures/multi_gen_baseline/",
    "fixtures/parser_hardcases/",
    "fixtures/qmcpack_foss_2026_1/",
    "fixtures/stack_order_installed/",
    "fixtures/stack_order_version_conflict/",
    "fixtures/two_root_openmpi_conflict/",
    "fixtures/LINT_FIXTURES.md",
    "llms-full.txt",
    "llms.txt",
    "pixi.lock",
    "scripts/",
    "skills/",
    "target/",
    "tests/",
]

[[bin]]
name = "eb-stack"
path = "src/main.rs"

# cargo-dist builds with --profile=dist
[profile.dist]
inherits = "release"
lto = "thin"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = "0.4"
petgraph = "0.7"
regex = "1"
rustpython-parser = { version = "0.4", default-features = false, features = ["location", "num-bigint"] }
rustpython-ast = { version = "0.4", default-features = false, features = ["visitor"] }
resolvo = { version = "0.11", features = ["version-ranges"] }
version-ranges = "0.1"
serde_yaml = "0.9"
toml = "0.9"
cyclonedx-bom = "0.8"
fs2 = "0.4"
sha2 = "0.11"
ureq = "2"
flate2 = "1"
tar = "0.4"
object = { version = "0.40.0", default-features = false, features = ["std", "read"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
# RFC 9162 Merkle log for `ledger`, plus tiled/indexed storage.
# A shared source gives both crates the same Merkle tree types.
# Exact versions define registry dependencies, and the revision fixes development source.
rfc9162 = "=0.8.1"
rfc9162-tiles = "=0.8.1"
rfc9162-log = "=0.8.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
jsonschema = { version = "0.26", default-features = false }
tempfile = "3"
